<!-- ==========================================================================
     Qianfan Shen — cursor-reactive flow-field particle hero
     Self-contained Jekyll include · no external libraries · ~7 KB.

     INTEGRATION (al-folio):
       1. Save this file as  _includes/hero_particles.html
       2. In _layouts/about.liquid, replace the <div class="about-hero"> … </div>
          block with:   {% include hero_particles.html %}
     Reads html[data-theme] (al-folio light/dark) with a prefers-color-scheme
     fallback, and re-themes live when the toggle is used. Lazy: the animation
     only runs while the hero is on-screen and the tab is visible. Honours
     prefers-reduced-motion (renders a single static frame, no rAF loop).
     ========================================================================== -->
<section id="qf-hero" tabindex="0" role="img"
         aria-label="Qianfan Shen — building a world simulator. An interactive particle flow field: move the cursor to stir it and warm the particles from cool to hot.">
  <canvas id="qf-hero-canvas" aria-hidden="true"></canvas>
  <div class="qf-hero-scrim" aria-hidden="true"></div>
  <div class="qf-hero-inner">
    <h1 class="qf-hero-name"><span class="qf-fn">Qianfan</span> <span class="qf-ln">Shen</span></h1>
    <p class="qf-hero-tag">Building a World Simulator</p>
  </div>
  <span class="qf-hero-hint" aria-hidden="true">move to stir · velocity&nbsp;&rarr;&nbsp;temperature</span>
</section>

<style>
  @import url("https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap");
  html:has(#qf-hero) { overflow-x: clip; }

  #qf-hero {
    position: relative;
    left: 50%;
    width: 100vw;
    margin-left: -50vw;
    min-height: 380px;
    margin-top: 0;
    margin-bottom: 2.25rem;
    overflow: hidden;
    isolation: isolate;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    --qf-bg: #07070b;
    --qf-name: #f4f4f8;
    --qf-tag: #b7b7c6;
    --qf-hint: rgba(255, 255, 255, 0.34);
    --qf-ring: #8b7bff;
    --qf-scrim: linear-gradient(90deg, rgba(4, 4, 9, 0.8) 0%, rgba(4, 4, 9, 0.46) 34%, rgba(4, 4, 9, 0) 66%);
    background: var(--qf-bg);
  }
  #qf-hero[data-qf-theme="light"] {
    --qf-bg: #eef0f5;
    --qf-name: #0b0f19;
    --qf-tag: #525b6e;
    --qf-hint: rgba(20, 24, 40, 0.42);
    --qf-ring: #6d5ef0;
    --qf-scrim: linear-gradient(90deg, rgba(238, 240, 245, 0.86) 0%, rgba(238, 240, 245, 0.5) 34%, rgba(238, 240, 245, 0) 66%);
  }

  #qf-hero-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    background: transparent;
  }
  .qf-hero-scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: var(--qf-scrim);
  }
  .qf-hero-inner {
    position: relative;
    z-index: 2;
    max-width: 930px;
    margin: 0 auto;
    height: 100%;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 0 32px;
    box-sizing: border-box;
    pointer-events: none;
  }
  .qf-hero-name {
    margin: 0;
    font-family: "PT Serif", "Times New Roman", Times, Georgia, serif;
    font-size: clamp(2.15rem, 5.3vw, 3.3rem);
    line-height: 1.06;
    letter-spacing: -0.012em;
    white-space: nowrap;
    color: var(--qf-name);
  }
  .qf-hero-name .qf-fn { font-weight: 700; }
  .qf-hero-name .qf-ln { font-weight: 400; }
  .qf-hero-tag {
    margin: 0.7rem 0 0;
    font-family: "PT Serif", "Times New Roman", Times, Georgia, serif;
    font-style: italic;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    font-weight: 400;
    letter-spacing: 0.005em;
    color: var(--qf-tag);
  }
  .qf-hero-hint {
    position: absolute;
    z-index: 2;
    right: max(20px, calc((100vw - 930px) / 2 + 32px));
    bottom: 16px;
    font-family: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Monaco, "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--qf-hint);
    transition: opacity 0.6s ease;
    pointer-events: none;
  }
  .qf-hero-hint.qf-hidden { opacity: 0; }

  #qf-hero:focus-visible { box-shadow: inset 0 0 0 2px var(--qf-ring); }

  @media (hover: none) { .qf-hero-hint { display: none; } }
  @media (prefers-reduced-motion: reduce) { .qf-hero-hint { display: none; } }
  @media (max-width: 600px) {
    #qf-hero { min-height: 300px; }
    .qf-hero-inner { min-height: 300px; padding: 0 22px; }
  }
</style>

<script>
  (function () {
    var host = document.getElementById("qf-hero");
    if (!host || host.dataset.qfInit) return;
    host.dataset.qfInit = "1";
    var canvas = document.getElementById("qf-hero-canvas");
    var ctx = canvas.getContext("2d", { alpha: true });
    var hint = host.querySelector(".qf-hero-hint");

    /* ---- tuning ------------------------------------------------------- */
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var FLOW_SPEED = 0.6;      // ambient drift speed (px/frame)
    var FLOW_LERP = 0.06;      // how fast particles settle onto the flow
    var CURSOR_PUSH = 3.0;       // repulsion impulse strength
    var CURSOR_SWIRL = 0.6;      // tangential (fluid) component of the push
    var HEAT_CUT = 0.9;          // particle speed below this stays cool (keeps the field calm at rest)
    var HEAT_SPAN = 2.2;         // speed span above the cut that ramps cool→hot (velocity → temperature)
    var CURSOR_SPEED_REF = 18;   // cursor travel speed that maps to full heat
    var COOL = 0.945;          // per-frame temperature decay (heat rises fast, cools slow)
    var TIME_SCALE = 0.00016;  // flow-field evolution speed
    var LUT_N = 48;            // colour buckets across the cool→warm ramp

    /* cool → warm temperature ramps (velocity → temperature) */
    var palettes = {
      dark:  [[0, 79, 70, 229], [0.28, 124, 77, 255], [0.52, 198, 77, 224], [0.74, 255, 107, 92], [1, 245, 197, 66]],
      light: [[0, 67, 56, 202], [0.28, 112, 40, 217], [0.52, 191, 46, 134], [0.74, 232, 84, 58], [1, 224, 139, 18]]
    };
    var BG = { dark: [7, 7, 11], light: [238, 240, 245] };
    var FADE = { dark: 0.22, light: 0.18 };

    var theme = "dark", sprites = [], lut = [], reduce = false;
    var W = 0, H = 0, particles = [], count = 0;
    var cx = 0, cy = 0, tx = 0, ty = 0, pcx = 0, pcy = 0, active = false;
    var time = 0, running = false, started = false, rafId = 0, last = 0, onscreen = false;
    var kbMode = false, kbAngle = 0;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function buildLUT(stops) {
      var out = [];
      for (var i = 0; i < LUT_N; i++) {
        var t = i / (LUT_N - 1), j = 0;
        while (j < stops.length - 1 && t > stops[j + 1][0]) j++;
        var s0 = stops[j], s1 = stops[Math.min(j + 1, stops.length - 1)];
        var span = (s1[0] - s0[0]) || 1, f = (t - s0[0]) / span;
        out.push([Math.round(lerp(s0[1], s1[1], f)), Math.round(lerp(s0[2], s1[2], f)), Math.round(lerp(s0[3], s1[3], f))]);
      }
      return out;
    }
    function makeSprite(r, g, b) {
      var s = 64, c = document.createElement("canvas"); c.width = c.height = s;
      var x = c.getContext("2d"), h = s / 2;
      var grd = x.createRadialGradient(h, h, 0, h, h, h);
      grd.addColorStop(0, "rgba(" + r + "," + g + "," + b + ",0.95)");
      grd.addColorStop(0.28, "rgba(" + r + "," + g + "," + b + ",0.5)");
      grd.addColorStop(1, "rgba(" + r + "," + g + "," + b + ",0)");
      x.fillStyle = grd; x.fillRect(0, 0, s, s);
      return c;
    }
    function buildSprites() {
      lut = buildLUT(palettes[theme]);
      sprites = lut.map(function (c) { return makeSprite(c[0], c[1], c[2]); });
    }

    function paintBg() {
      var b = BG[theme];
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgb(" + b[0] + "," + b[1] + "," + b[2] + ")";
      ctx.fillRect(0, 0, W, H);
    }
    function applySize() {
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      paintBg();
    }
    // Measure the host and (re)build only when the size actually changes. If this runs
    // before layout (W/H = 0 — e.g. mounted in a hidden tab/container), it defers; the
    // ResizeObserver calls it again once a real size exists, so the hero never stays blank.
    function remeasure(force) {
      var w = host.clientWidth, h = host.clientHeight;
      if (!force && w === W && h === H) return;
      W = w; H = h;
      if (!W || !H) return;
      applySize();
      makeParticles();
      if (reduce || !running) drawStatic();
      if (onscreen && !running && !reduce) start();
    }
    function makeParticles() {
      var area = W * H;
      count = Math.max(80, Math.min(260, Math.round(area / 3200)));
      if (W < 600) count = Math.min(count, 150);
      particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, z: Math.pow(Math.random(), 0.8), temp: Math.random() * 0.12 });
      }
    }

    function flow(x, y, t) {
      var kx = 0.0016, ky = 0.0016, k2 = 0.0022;
      var a = x * kx + t, b = y * ky - t * 0.8, c = (x + y) * k2 - t * 0.6;
      var dPdx = kx * Math.cos(a) * Math.cos(b) + 0.6 * k2 * Math.cos(c);
      var dPdy = -ky * Math.sin(a) * Math.sin(b) + 0.6 * k2 * Math.cos(c);
      var vx = dPdy, vy = -dPdx, m = Math.hypot(vx, vy) || 1e-6;
      return [vx / m, vy / m];
    }

    function drawParticle(p) {
      var idx = (p.temp * (LUT_N - 1)) | 0; if (idx < 0) idx = 0; else if (idx > LUT_N - 1) idx = LUT_N - 1;
      var dk = theme === "dark";
      var glow = (dk ? 3.2 : 2.4) + p.z * (dk ? 4.2 : 3.0);
      glow *= 0.8 + p.temp * (dk ? 1.5 : 1.05);
      var a = (dk ? 0.32 : 0.42) + p.temp * 0.5 + p.z * 0.2; if (a > 1) a = 1;
      ctx.globalAlpha = a;
      ctx.drawImage(sprites[idx], p.x - glow, p.y - glow, glow * 2, glow * 2);
      var cr = lut[idx], coreR = 0.6 + p.z * 1.1 + p.temp * 0.6;
      ctx.globalAlpha = a + 0.15 > 1 ? 1 : a + 0.15;
      ctx.fillStyle = "rgb(" + cr[0] + "," + cr[1] + "," + cr[2] + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, coreR, 0, 6.2832); ctx.fill();
    }

    function step(dt) {
      cx += (tx - cx) * 0.2; cy += (ty - cy) * 0.2;
      if (kbMode) {
        kbAngle += 0.012 * dt;
        var rr = Math.min(W, H) * 0.22;
        tx = W * 0.5 + Math.cos(kbAngle) * rr * 1.4;
        ty = H * 0.5 + Math.sin(kbAngle * 1.3) * rr;
        active = true;
      }
      var cSpeed = Math.hypot(cx - pcx, cy - pcy); pcx = cx; pcy = cy;
      var cHeat = cSpeed / CURSOR_SPEED_REF; if (cHeat > 1) cHeat = 1;
      var R = Math.max(110, Math.min(230, Math.min(W, H) * 0.3));
      var b = BG[theme];
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(" + b[0] + "," + b[1] + "," + b[2] + "," + FADE[theme] + ")";
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = theme === "dark" ? "lighter" : "source-over";
      for (var i = 0; i < count; i++) {
        var p = particles[i];
        var fv = flow(p.x, p.y, time);
        var tvx = fv[0] * FLOW_SPEED * (0.45 + 0.75 * p.z);
        var tvy = fv[1] * FLOW_SPEED * (0.45 + 0.75 * p.z);
        p.vx += (tvx - p.vx) * FLOW_LERP;
        p.vy += (tvy - p.vy) * FLOW_LERP;
        var prox = 0;
        if (active) {
          var dx = p.x - cx, dy = p.y - cy, d2 = dx * dx + dy * dy;
          if (d2 < R * R) {
            var d = Math.sqrt(d2) || 0.001, f = 1 - d / R, f2 = f * f, push = f2 * CURSOR_PUSH * (0.5 + 0.8 * p.z);
            p.vx += (dx / d) * push + (-dy / d) * push * CURSOR_SWIRL;
            p.vy += (dy / d) * push + (dx / d) * push * CURSOR_SWIRL;
            prox = f2;
          }
        }
        p.x += p.vx * dt; p.y += p.vy * dt;
        var mg = 30;
        if (p.x < -mg) p.x += W + 2 * mg; else if (p.x > W + mg) p.x -= W + 2 * mg;
        if (p.y < -mg) p.y += H + 2 * mg; else if (p.y > H + mg) p.y -= H + 2 * mg;
        var sp = Math.hypot(p.vx, p.vy);
        var sn = (sp - HEAT_CUT) / HEAT_SPAN; if (sn < 0) sn = 0; else if (sn > 1) sn = 1;
        var target = sn;
        if (prox > 0) { var ph = prox * (0.35 + 0.65 * cHeat); if (ph > target) target = ph; }
        if (target > p.temp) p.temp += (target - p.temp) * 0.6; else p.temp *= COOL;
        drawParticle(p);
      }
      ctx.globalAlpha = 1;
    }

    function drawStatic() {
      paintBg();
      ctx.globalCompositeOperation = theme === "dark" ? "lighter" : "source-over";
      for (var i = 0; i < count; i++) {
        var p = particles[i];
        var warm = Math.max(0, 1 - Math.abs(p.x - W * 0.3) / (W * 0.5));
        p.temp = 0.05 + 0.32 * warm * warm * p.z;
        drawParticle(p);
      }
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      if (!running) return;
      var dt = (now - last) / 16.67; if (dt > 2.5) dt = 2.5; if (!dt) dt = 1; last = now;
      time += dt * 16.67 * TIME_SCALE;
      step(dt);
      rafId = requestAnimationFrame(frame);
    }
    function start() {
      if (reduce || running || !W || !H) return;
      started = true;
      if (!particles.length) makeParticles();
      running = true; last = performance.now(); paintBg(); rafId = requestAnimationFrame(frame);
    }
    function stop() { running = false; if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

    function readTheme() {
      var t = document.documentElement.getAttribute("data-theme");
      if (t === "dark") return "dark";
      if (t === "light") return "light";
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function setTheme(t) {
      if (t === theme && sprites.length) return;
      theme = t; host.setAttribute("data-qf-theme", t); buildSprites();
      if (reduce || !running) drawStatic();
    }
    function isOnscreen() {
      var r = host.getBoundingClientRect();
      return r.bottom > 0 && r.top < (window.innerHeight || document.documentElement.clientHeight);
    }

    function init() {
      reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      theme = readTheme();
      host.setAttribute("data-qf-theme", theme);
      buildSprites();
      remeasure(true);
      if (!W || !H) {
        // Not laid out yet (init ran before layout, or inside a hidden container).
        // setTimeout fires even while the document is hidden, so this guarantees a
        // first paint once the element ever gets a real size — no manual resize needed.
        (function poll(n) {
          if (W && H) return;
          remeasure(true);
          if ((W && H) || n <= 0) return;
          setTimeout(function () { poll(n - 1); }, 100);
        })(40);
      }

      if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (es) {
          for (var i = 0; i < es.length; i++) {
            onscreen = es[i].isIntersecting;
            if (onscreen) start(); else stop();
          }
        }, { threshold: 0.01 }).observe(host);
      } else { onscreen = true; start(); }

      if ("ResizeObserver" in window) {
        new ResizeObserver(function () { remeasure(false); }).observe(host);
      }

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) stop(); else if (isOnscreen()) start();
      });

      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          remeasure(true);
        }, 160);
      });

      host.addEventListener("pointermove", function (e) {
        var r = host.getBoundingClientRect();
        tx = e.clientX - r.left; ty = e.clientY - r.top; active = true; kbMode = false;
        if (hint) hint.classList.add("qf-hidden");
      }, { passive: true });
      host.addEventListener("pointerdown", function (e) {
        var r = host.getBoundingClientRect();
        tx = e.clientX - r.left; ty = e.clientY - r.top; active = true;
      });
      host.addEventListener("pointerleave", function () { active = false; });

      host.addEventListener("focus", function () {
        kbMode = true; active = true; cx = tx = W * 0.5; cy = ty = H * 0.5;
        if (hint) hint.classList.add("qf-hidden");
      });
      host.addEventListener("blur", function () { kbMode = false; active = false; });
      host.addEventListener("keydown", function (e) {
        var k = e.key, s = 32;
        if (k === "ArrowLeft" || k === "ArrowRight" || k === "ArrowUp" || k === "ArrowDown") {
          kbMode = false; active = true;
          if (k === "ArrowLeft") tx -= s; else if (k === "ArrowRight") tx += s;
          else if (k === "ArrowUp") ty -= s; else ty += s;
          tx = Math.max(0, Math.min(W, tx)); ty = Math.max(0, Math.min(H, ty));
          e.preventDefault();
        }
      });

      if ("MutationObserver" in window) {
        new MutationObserver(function () { setTheme(readTheme()); })
          .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      }
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var onmq = function () { if (!document.documentElement.getAttribute("data-theme")) setTheme(readTheme()); };
        mq.addEventListener ? mq.addEventListener("change", onmq) : mq.addListener(onmq);
        var rm = window.matchMedia("(prefers-reduced-motion: reduce)");
        var onrm = function (e) { reduce = e.matches; if (reduce) { stop(); drawStatic(); } else if (isOnscreen()) start(); };
        rm.addEventListener ? rm.addEventListener("change", onrm) : rm.addListener(onrm);
      }
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
</script>
